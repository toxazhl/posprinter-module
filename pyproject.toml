[project]
name = "posprinter-module"
version = "0.2.0"
description = "JSON stdin/stdout daemon for ESC/POS receipt printers"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "escpos>=2.0.0",
    "pillow>=12.0.0",
    "pydantic>=2.12.5",
    "pypdfium2>=5.3.0",
    "pyserial>=3.5",
    "pywin32>=311; sys_platform == 'win32'",
    "setuptools<81",
]

[dependency-groups]
dev = [
    "nuitka>=2.8.9",
]
